<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <title>Portfolio</title>
</head>
<style>
    :root {
        --bg: #050505;
        --surface: #0a0a0a;
        --surface-2: #101010;
        --text: #ffffff;
        --muted: #a9a9a9;
        --line: #222;
        --accent: #2ea7b5;
    }

    * {
        box-sizing: border-box;
    }

    body {
        font-family: Arial, sans-serif;
        margin: 0;
        padding: 0;
        background-color: var(--bg);
        color: var(--text);
    }

    header {
        background: #000;
        color: var(--text);
        padding: 14px 0;
        border-bottom: 1px solid var(--line);
    }

    nav {
        width: min(1100px, 92%);
        margin: 0 auto;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
    }

    h1,
    h6 {
        margin: 0;
    }

    h1 {
        font-size: 2rem;
        color: var(--accent);
    }

    h6 {
        color: var(--muted);
        font-weight: 500;
    }

    nav ul {
        list-style: none;
        margin: 0;
        padding: 10px 14px;
        border: 1px solid var(--line);
        border-radius: 10px;
        display: flex;
        align-items: center;
        gap: 14px;
    }

    nav ul li a {
        color: var(--text);
        text-decoration: none;
        font-size: 1rem;
        transition: color 0.2s ease;
    }

    nav ul li a:hover {
        color: #69c5cf;
    }

    .skills-section {
        background: var(--surface);
        padding: 36px;
        margin: 36px auto;
        width: min(900px, 92%);
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
        border: 1px solid #fff;
        border-radius: 14px;
        box-shadow: 0 10px 24px rgba(0, 0, 0, 0.35);
        transition: transform 0.25s ease, box-shadow 0.25s ease, border-color 0.25s ease;
    }

    .skills-section:hover {
        transform: translateY(-4px);
        border-color: var(--accent);
        box-shadow: 0 14px 30px rgba(0, 0, 0, 0.45);
    }

    .skills-section h3 {
        margin: 0 0 20px;
        color: #fff;
        font-size: 1.75rem;
    }

    .skills-section ul {
        list-style: none;
        padding: 0;
        margin: 0;
        width: 100%;
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 16px;
    }

    .skills-section ul li {
        min-height: 110px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 10px;
        padding: 18px;
        color: #fff;
        background: var(--surface-2);
        border: 1px solid var(--line);
        border-radius: 10px;
        font-size: 1.1rem;
        text-align: center;
        transition: background-color 0.2s ease, transform 0.2s ease, border-color 0.2s ease;
    }

    .skills-section ul li i {
        color: var(--accent);
        font-size: 1.3rem;
    }

    .skills-section ul li:hover {
        background: #141414;
        border-color: var(--accent);
        transform: translateY(-3px);
    }

    footer {
        background: #000;
        color: #c4c4c4;
        text-align: center;
        padding: 16px 10px;
        border-top: 1px solid var(--line);
    }

    @media (max-width: 700px) {
        nav {
            flex-direction: column;
        }

        .skills-section {
            padding: 24px;
        }

        .skills-section h3 {
            font-size: 1.45rem;
        }

        .skills-section ul {
            grid-template-columns: 1fr;
        }

        .skills-section ul li {
            min-height: 95px;
            font-size: 1rem;
        }
    }
</style>
<body>
    <header>
        <nav>
            <div>
                <h1>Portfolio</h1>
                <h6>Team one Portfolio</h6>
            </div>
            <ul>
                <li><a href="#about">About</a></li>
                <li><a href="#projects">Projects</a></li>
                <li><a href="#contact">Contact</a></li>
            </ul>
        </nav>
    </header>

    <section class="skills-section">
        <h3><i class="fa-solid fa-gears"></i> Skills We Possess</h3>
        <ul>
            <li><i class="fa-solid fa-people-group"></i> Teamwork</li>
            <li><i class="fa-brands fa-github"></i> GitHub Collaboration</li>
            <li><i class="fa-brands fa-html5"></i> HTML5</li>
            <li><i class="fa-solid fa-robot"></i> Robotics Basics</li>
        </ul>
    </section>

    <footer>
        <p>&copy; 2023 The one Portfolio</p>
    </footer>
</body>
</html>
